name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Code updates are uploaded as update.zip (from the GitHub website).
      # This step unpacks it into the repository and commits the result.
      - name: Apply update.zip if present
        run: |
          if [ -f update.zip ]; then
            unzip -o -q update.zip -d .
            if [ -f update-delete.txt ]; then
              xargs -a update-delete.txt rm -f
              rm -f update-delete.txt
            fi
            rm -f update.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply uploaded update.zip"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npx vite build --base=./

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
